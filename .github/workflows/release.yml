name: Release

# Runs when a v* tag is pushed. Cut releases with scripts/release.sh X.Y.Z, which bumps the version,
# dates the CHANGELOG section, and creates the annotated tag (push it with the commit:
# `git push --atomic origin master vX.Y.Z`; a plain `git push` does not push tags).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Check version and release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Tag, sources and CHANGELOG agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          cmake_version="$(sed -nE 's/^  VERSION ([0-9.]+)$/\1/p' CMakeLists.txt)"
          test "$cmake_version" = "$version" \
            || { echo "::error::Tag $GITHUB_REF_NAME but CMakeLists.txt says $cmake_version (use scripts/release.sh)"; exit 1; }
          grep -q "kVersionText{\"$version\"}" src/core/version.hpp \
            || { echo "::error::src/core/version.hpp is not at $version"; exit 1; }
          bash scripts/release_notes.sh "$version"

  images:
    name: Publish ${{ matrix.flavor }} demo image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        flavor: [cpu, gpu]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            prefix=${{ matrix.flavor }}-,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.demo.${{ matrix.flavor }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=demo-${{ matrix.flavor }}

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG.md
        run: bash scripts/release_notes.sh "${GITHUB_REF_NAME#v}" > notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: data/benchmarks/latest/*.json
          body_path: notes.md
