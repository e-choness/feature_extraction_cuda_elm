name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (CUDA toolchain, no GPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.dev
          tags: feature-elm-dev:test
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Lint workflow files
        run: docker run --rm -v "${{ github.workspace }}:/workspace" feature-elm-dev:test actionlint

      - name: Run tests (GPU tests skip without a device)
        run: docker run --rm feature-elm-dev:test ctest --output-on-failure

      - name: Run style check
        run: docker run --rm feature-elm-dev:test ./scripts/style_check.sh

  cpu-only:
    name: Build & test (CPU-only, no CUDA toolkit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libgtest-dev libbenchmark-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  demo-images:
    name: Build demo images
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        flavor: [cpu, gpu]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.flavor }} demo image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.demo.${{ matrix.flavor }}
          tags: feature-elm-demo-${{ matrix.flavor }}:test
          load: ${{ matrix.flavor == 'cpu' }}
          cache-from: type=gha,scope=demo-${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.flavor }}

      - name: Smoke-test CPU demo
        if: matrix.flavor == 'cpu'
        run: |
          docker run -d --name demo -p 7860:7860 feature-elm-demo-cpu:test
          for _ in $(seq 1 30); do curl -sf localhost:7860/api/health && break; sleep 1; done
          curl -sf -X POST localhost:7860/api/evaluate -d '{"hidden":128}' | tee /tmp/eval.json
          grep -q '"status":"ok"' /tmp/eval.json
          test "$(curl -s -o /dev/null -w '%{http_code}' --path-as-is 'localhost:7860//../../etc/passwd')" != 200
          docker rm -f demo

  zerogpu-library:
    name: Build ZeroGPU library (C API, CUDA 12.8)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build libfeature_elm_capi.so
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.capi
          outputs: type=local,dest=out
          cache-from: type=gha,scope=capi
          cache-to: type=gha,mode=max,scope=capi

      - name: Check exports and glibc floor
        run: |
          nm -D --defined-only out/libfeature_elm_capi.so | grep -c " T felm_" | grep -qx 6
          ! objdump -T out/libfeature_elm_capi.so | grep -oE "GLIBC_2\.(3[6-9]|[4-9][0-9])"
