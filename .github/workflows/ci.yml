name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install actionlint
        uses: igcpp/actionlint-installer@v1

      - name: Lint workflow files
        run: actionlint .github/workflows/*.yml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test (CPU)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          tags: feature-elm-dev:test
          load: true

      - name: Run CPU tests
        run: |
          docker run --rm feature-elm-dev:test ctest --output-on-failure

      - name: Run demo_api tests
        run: |
          docker run --rm feature-elm-dev:test ctest -R demo_api --output-on-failure

      - name: Run style check
        run: |
          docker run --rm feature-elm-dev:test ./scripts/style_check.sh

      - name: Build docs
        run: |
          docker run --rm feature-elm-dev:test ./scripts/docs_build.sh

      - name: Build CUDA image (verify compilation)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.demo.gpu
          tags: feature-elm-demo-gpu:test
          load: true

      - name: Build CPU demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.demo.cpu
          tags: feature-elm-demo-cpu:test
          load: true